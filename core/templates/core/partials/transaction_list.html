{% for t in transactions %}
<tr>
  <td class="text-light cell-round-left">{{ t.date|date:"M d, Y" }}</td>
  <td class="font-bold">{{ t.description }}</td>
  <td class="text-right cell-round-right {% if t.amount < 0 %}text-danger{% else %}text-success{% endif %} font-bold no-wrap">
    {% if t.amount > 0 %}+{% endif %}{{ t.amount|floatformat:2 }} {{ user.userprofile.currency_symbol }}
  </td>
</tr>
{% empty %}
<tr>
  <td colspan="3" class="text-light text-center pd-2">No transactions found in this period.</td>
</tr>
{% endfor %}
