{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="{{ user.userprofile.theme|default:'light' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dalen</title>
  <link rel="icon" href="{% static 'img/favicon.svg' %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="{% static 'js/slimselect.min.js' %}"></script>

  <link rel="stylesheet" href="{% static 'fontawesomefree/css/all.min.css' %}" type="text/css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="app-background"></div>
  <div class="app-wrapper">
    {% if user.is_authenticated %}
    <nav class="top-nav glass-panel">
      <div class="nav-content">
        <a href="{% url 'dashboard' %}" class="nav-brand">
          <div class="brand-icon-wrapper">
            <img src="{% static 'img/logo.svg' %}" alt="Logo">
          </div>
          <span>Dalen</span>
        </a>
        <div class="nav-user">
          <span class="username hidden-mobile">Hi, {{ user.username }}</span>
          <a href="{% url 'fixed_flows' %}" class="icon-btn" title="Fixed Income & Expenses">
            <i class="fas fa-file-invoice-dollar"></i>
          </a>
          <a href="{% url 'settings' %}" class="icon-btn" title="Settings">
            <i class="fas fa-cog"></i>
          </a>
          <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="icon-btn logout-btn" title="Sign Out">
              <i class="fas fa-sign-out-alt"></i>
            </button>
          </form>
        </div>
      </div>
    </nav>
    {% endif %}

    <main class="content-container">
      {% if messages %}
      <div class="messages">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
          <i class="fas fa-info-circle"></i> {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const selects = document.querySelectorAll('select');

      selects.forEach(select => {
        const enableSearch = select.dataset.search == 'true';

        select.slim = new SlimSelect({
          select: select,
          settings: { showSearch: enableSearch }
        });
      });
    });
  </script>
</body>
</html>
