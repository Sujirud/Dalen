{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="{{ user.userprofile.theme|default:'light' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dalen</title>
  <link rel="icon" href="{% static 'img/favicon.svg' %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="{% static 'js/slimselect.min.js' %}"></script>

  <link rel="stylesheet" href="{% static 'fontawesomefree/css/all.min.css' %}" type="text/css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="app-background"></div>
  <div class="app-wrapper">
    {% if user.is_authenticated %}
    <nav class="top-nav glass-panel">
      <div class="nav-content">
        <a href="{% url 'dashboard' %}" class="nav-brand">
          <div class="brand-icon-wrapper">
            <img src="{% static 'img/logo.svg' %}" alt="Logo">
          </div>
          <span>Dalen</span>
        </a>
        <div class="nav-user">
          <span class="username hidden-mobile">Hi, {{ user.username }}</span>
          <a href="{% url 'fixed_flows' %}" class="icon-btn" title="Fixed Income & Expenses">
            <i class="fas fa-file-invoice-dollar"></i>
          </a>
          <a href="{% url 'settings' %}" class="icon-btn" title="Settings">
            <i class="fas fa-cog"></i>
          </a>
          <button id="logoutBtn" class="icon-btn logout-btn" title="Sign Out">
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </div>
      </div>
    </nav>
    {% endif %}

    <main class="content-container">
      {% if messages %}
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }} mb-2">{{ message }}</div>
      {% endfor %}
      {% endif %}

      {% block content %}{% endblock %}
    </main>

    <dialog id="modal-dialog"><div id="modal-container" class="card-small panel"></div></dialog>
  </div>

  <script>
    class Dialog {
      constructor() {
        this.container = document.getElementById("modal-dialog");
        this.modal = document.getElementById("modal-container");

        this.container.addEventListener('click', (e) => { if (e.target === this.container) this.container.close(); });
      }

      open(content) {
        this.modal.innerHTML = content;
        this.container.showModal();
        document.body.style.overflow = 'hidden';
      }
      close() {
        this.container.close();
        document.body.style.overflow = '';
      }
    }

    document.addEventListener('DOMContentLoaded', () => { window.dialog = new Dialog(); });
  </script>

  {% if user.is_authenticated %}
  <script>
    const logoutModalContent = `
    <form action="{% url 'logout' %}" method="post" class="flex-column">
      {% csrf_token %}

      <div class="modal-header">
        <h3>Confirm Logout</h3>
        <button type="button" class="close-btn" onclick="window.dialog.close()">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <p>Are you sure you want to log out?</p>

      <div class="form-actions">
        <button type="button" class="btn btn-outline btn-sm" onclick="window.dialog.close()">Cancel</button>
        <button type="submit" class="btn btn-danger btn-sm">Logout</button>
      </div>
    </form>
    `
    document.getElementById("logoutBtn").addEventListener("click", () => window.dialog.open(logoutModalContent));
  </script>
  {% endif %}

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const selects = document.querySelectorAll('select');

      selects.forEach(select => {
        const enableSearch = select.dataset.search == 'true';

        select.slim = new SlimSelect({
          select: select,
          settings: { showSearch: enableSearch }
        });
      });
    });
  </script>
</body>
</html>
