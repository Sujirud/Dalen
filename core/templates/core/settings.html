{% extends 'core/base.html' %}
{% block content %}
<div class="flex-column">
  <div class="ml-2">
    <h2><i class="fas fa-sliders-h"></i> Settings</h2>
    <p>Manage your account preferences.</p>
  </div>

  <div class="card glass-panel flex-column">
    <h3 class="font-size-2"><i class="fas fa-user-circle"></i> Account</h3>

    <form method="post" class="styled-form">
      {% csrf_token %}
      <input type="hidden" name="action" value="update_username">
      <h4>Username</h4>

      <div class="form-field row">
        <div class="input-wrapper">
          <i class="fas fa-user input-icon"></i>
          <input type="text" name="username" value="{{ user.username }}" required>
        </div>

        <button type="submit" class="btn btn-outline btn-sm">Change Username</button>
      </div>
    </form>

    <div class="styled-form">
      <div class="form-field row">
        <div>
          <h4>Password</h4>
          <p>Change your account password</p>
        </div>
        <button id="changePasswordBtn" class="btn btn-outline btn-sm">Change Password</button>
      </div>
    </div>
  </div>

  <div class="card glass-panel flex-column">
    <h3 class="font-size-2"><i class="fas fa-globe"></i> Regional Settings</h3>

    <form method="post" class="styled-form">
      {% csrf_token %}
      <input type="hidden" name="action" value="update_currency-symbol">

      <div class="form-field">
        <label>Currency</label>
        <select name="currency_symbol" data-search="true" onchange="this.form.submit()">
          {% for symbol, codes in currencies.items %}
            <option value="{{ symbol }}" {% if profile.currency_symbol == symbol %}selected{% endif %}>
              {{ codes|join:", " }} ({{ symbol }})
            </option>
          {% endfor %}
        </select>
      </div>
    </form>

    <form method="post" class="styled-form" id="timezoneForm">
      {% csrf_token %}
      <input type="hidden" name="action" value="update_timezone">

      <div class="form-field row">
        <div>
          <label>
            Time Zone
            <small id="clockDisplay" class="ml-2" style="color: var(--primary);">
              <i class="far fa-clock"></i> Local time: --:--
            </small>
          </label>
          <select name="timezone" id="timezoneSelect" data-search="true">
            {% for tz in timezones %}
            <option value="{{ tz }}" {% if profile.timezone == tz %}selected{% endif %}>{{ tz }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="flex-column" style="gap: 0;">
          <button type="button" class="btn btn-outline btn-sm btn-full" onclick="detectTimezone()" title="Detect my location">
            <i class="fas fa-location-arrow"></i> Auto
          </button>
          <button type="submit" class="btn btn-outline btn-sm btn-full">Save</button>
        </div>
      </div>
    </form>
  </div>

  <div class="card glass-panel flex-column">
    <h3 class="font-size-2"><i class="fas fa-paint-brush"></i> Preferences</h3>

    <form method="post" class="styled-form">
      {% csrf_token %}
      <input type="hidden" name="action" value="update_theme">

      <div class="form-field">
        <label>Color Theme</label>
        <select name="theme" onchange="this.form.submit()">
          <option value="light" {% if profile.theme == 'light' %}selected{% endif %}>Light Mode</option>
          <option value="dark" {% if profile.theme == 'dark' %}selected{% endif %}>Dark Mode</option>
        </select>
      </div>
    </form>
  </div>
</div>

<script>
  const passwordModalContent = `
    <div class="modal-header">
      <h3>Change Password</h3>
      <button type="button" class="close-btn" onclick="window.dialog.close()">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <form method="post" class="styled-form">
      {% csrf_token %}
      <input type="hidden" name="action" value="change_password">

      {% for field in password_form %}
      <div class="form-field">
        <label>{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}
        <small class="help-text">{{ field.help_text }}</small>
        {% endif %}
        {% if field.errors %}
        <small class="error-text">
          <i class="fas fa-exclamation-circle"></i> {{ field.errors.0 }}
        </small>
        {% endif %}
      </div>
      {% endfor %}
      
      <div class="form-actions">
        <button type="button" class="btn btn-outline" onclick="window.dialog.close()">Cancel</button>
        <button type="submit" class="btn btn-primary">Set New Password</button>
      </div>
    </form>
  `
  document.getElementById("changePasswordBtn").addEventListener("click", () => window.dialog.open(passwordModalContent));

  // Automatically re-open modal if there are backend errors
  {% if password_form.errors %}
  document.addEventListener('DOMContentLoaded', openModal('passwordModal'));
  {% endif %}
</script>

<script>
  const select = document.getElementById('timezoneSelect');
  const display = document.getElementById('clockDisplay');

  function detectTimezone() {
    try {
      const detectedTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      if (select && detectedTz) {

        const exists = Array.from(select.options).some(opt => opt.value === detectedTz);

        if (exists) {
          if (select.slim) select.slim.setSelected(detectedTz);
          else select.value = detectedTz;

          updateClock(); // Visually update immediately
        } else {
          alert("Your system timezone (" + detectedTz + ") is not supported by the server.");
        }
      }
    } catch (e) { console.error("Timezone detection failed", e); }
  }

  function updateClock() {
    if (select && display) {
      const tz = select.value;
      try {
        const now = new Date();
        const timeString = now.toLocaleTimeString('en-US', { 
          timeZone: tz, 
          hour: '2-digit', 
          minute: '2-digit',
          weekday: 'short'
        });
        display.innerHTML = `<i class="far fa-clock"></i> ${timeString}`;
      } catch (e) {
        display.textContent = "";
      }
    }
  }

  if (select) select.addEventListener('change', updateClock);

  setInterval(updateClock, 10000);
  document.addEventListener('DOMContentLoaded', updateClock);
</script>
{% endblock %}
