{% extends 'core/base.html' %}
{% block content %}
<div class="center-stage goal-setup-stage">
  <div class="card-small glass-panel">
    <div class="header-block">
      <h2><i class="fas fa-flag"></i> Define Your Goal</h2>
      <p>What are you saving for?</p>
    </div>

    <form method="post" class="styled-form">
      {% csrf_token %}

      <div class="form-field">
        <label>Goal Name</label>
        <div class="input-wrapper">
          <i class="fas fa-pen input-icon"></i>
          <input type="text" name="goal_name" placeholder="e.g. Europe Trip" maxlength="50" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>Target Amount</label>
          <div class="input-wrapper">
            <span class="currency-symbol">{{ user.userprofile.currency_symbol }}</span>
            <input type="number" step="0.01" min="0.01" max="9999999999999" name="goal_amount" placeholder="0.00" required>
          </div>
        </div>
        
        <div class="form-field">
          <label>Timeline (Days)</label>
          <div class="input-wrapper">
            <i class="fas fa-calendar-alt input-icon"></i>
            <input type="number" name="days" min="1" max="3650" placeholder="0" required>
          </div>
        </div>
      </div>

      <div class="alert alert-info mt-2">
        <i class="fas fa-info-circle"></i> Creating a new plan will replace your current active goal.
      </div>

      <div class="form-actions">
        <a href="{% url 'dashboard' %}" class="btn btn-outline btn-full">Cancel</a>
        <button type="submit" class="btn btn-primary btn-full shadow-hover">Calculate Plan</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
