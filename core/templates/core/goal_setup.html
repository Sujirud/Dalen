{% extends 'core/base.html' %}
{% block content %}
<div class="goal-setup-stage">
  <div class="card-small glass-panel">
    <div>
      <h2><i class="fas fa-flag"></i> Define Your Goal</h2>
      <p>What are you saving for?</p>
    </div>

    <form method="post" class="styled-form">
      {% csrf_token %}

      <div class="form-field">
        <label>Goal Name</label>
        <div class="input-wrapper">
          <i class="fas fa-pen input-icon"></i>
          <input type="text" name="goal_name" placeholder="e.g. Europe Trip" maxlength="50" required value="{{ current_goal.name|default:'' }}">
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>Target Amount</label>
          <div class="input-wrapper">
            <span class="currency-symbol">{{ user.userprofile.currency_symbol }}</span>
            <input type="number" step="0.01" min="0.01" max="9999999999999" name="goal_amount" placeholder="0.00" required value="{{ current_goal.target_amount|default:'' }}">
          </div>
        </div>

        <div class="form-field">
          <label>Deadline</label>
          <div class="input-wrapper">
            <i class="fas fa-calendar-alt input-icon"></i>
            <input type="date" name="deadline" min="{{ min_date|date:'Y-m-d' }}" required value="{{ current_goal.deadline|date:'Y-m-d'|default:'' }}">
          </div>
        </div>
      </div>

      {% if current_goal %}
      <div class="alert alert-info">
        <i class="fas fa-info-circle"></i> Updating a plan will recalculate your daily budget.
      </div>
      {% endif %}

      <div class="form-actions">
        <a href="{% url 'dashboard' %}" class="btn btn-outline btn-full">Cancel</a>
        <button type="submit" class="btn btn-primary btn-full">
        {% if current_goal %}
          Update Plan
        {% else %}
          Create Plan
        {% endif %}
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
