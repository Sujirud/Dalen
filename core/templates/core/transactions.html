{% extends base_template %}
{% block content %}
<div id="transactionsContainer">
  <h1 class="mb-4">Transactions</h1>

  <div class="card glass-panel mb-2">
    <div id="txnFilters" class="form-row">

      <div class="form-field">
        <div class="input-wrapper">
          <i class="ph ph-magnifying-glass input-icon"></i>
          <input type="search" name="search" placeholder="Search descriptions..." autocomplete="off"
            hx-get="{% url 'transactions' %}"
            hx-target="#txnListContainer"
            hx-trigger="input changed delay:500ms, search"
            hx-include="#txnFilters">
        </div>
      </div>

      <div class="form-field">
        <div class="input-wrapper">
          <select id="categoryFilter" name="categories" multiple
            data-placeholder="Filter by category..."
            hx-get="{% url 'transactions' %}"
            hx-target="#txnListContainer"
            hx-trigger="change"
            hx-include="#txnFilters">
            {% for cat in categories %}
              <option value="{{ cat.id }}">
                {{ cat.name }}
              </option>
            {% endfor %}
          </select>
        </div>
      </div>

    </div>
  </div>

  <div class="flex justify-end items-baseline gap-2 pd-2">
    <button id="editModeToggle" class="text-primary font-medium">
      <i class="ph-bold ph-pencil-simple text-14"></i><span>Edit mode</span>
    </button>

    <a class="text-primary font-medium no-underline" href="{% url 'add_transaction' %}" title="Add Transaction"
      hx-get="{% url 'add_transaction' %}" hx-target="#main-content" hx-swap="innerHTML" hx-push-url="true">
      <i class="ph-bold ph-plus"></i><span>New Transaction</span>
    </a>
  </div>

  <div id="txnActionsBar" class="glass-panel">
    <div class="flex items-center gap-2">
      <label class="flex items-center gap-1">
        <input type="checkbox" id="selectAllCb"/>
        <div class="custom-cb"></div>

        <span class="font-medium">Select All</span>
      </label>

      <span id="selectedCount" class="text-primary font-medium">0 selected</span>
    </div>

    <div class="flex gap-1">
      <button type="button" class="btn btn-outline btn-sm" onclick="openModal('txnEditModal')">
        <i class="ph-bold ph-pen"></i> Edit
      </button>

      <button type="button" class="btn btn-outline btn-danger btn-sm"
        hx-post="{% url 'delete_transactions' %}"
        hx-include="#txnForm"
        hx-target="#main-content"
        hx-disabled-elt="this"
        hx-confirm="Are you sure you want to delete the selected transactions? This cannot be undone."
      >
        <i class="ph-bold ph-trash"></i>
      </button>
    </div>
  </div>

  <div class="card glass-panel pd-1">
    <form id="txnForm">
      {% csrf_token %}

      <div id="txnListContainer" class="txn-list">
        {% include "core/partial/transaction_list.html" %}
      </div>
    </form>
  </div>
</div>

<dialog id="txnEditModal">
  <div class="modal-card surface-panel">
    <div class="modal-header">
      <h3>Edit Transactions</h3>
      <button type="button" class="modal-close" onclick="closeModal('txnEditModal')">
        <i class="ph-bold ph-x"></i>
      </button>
    </div>

    <div class="styled-form">
      <p class="mb-1">Fill in only the fields you want to change. Leave empty to keep the original values.</p>

      <div class="form-field">
        <label>
          <span>Description</span>
          <div class="input-wrapper">
            <i class="ph ph-tag input-icon"></i>
            <input type="text" name="new_description" form="txnForm" placeholder="..." autocomplete="off"/>
          </div>
        </label>
      </div>

      <div class="form-field">
        <label>
          <span>Amount</span>
          <div class="input-wrapper">
            <span class="input-icon">{{ user.userprofile.currency_symbol }}</span>
            <input type="number" min="0.01" step="0.01" max="1000000000000" name="new_amount" form="txnForm" placeholder="e.g. -50.00 or 100.00" />
          </div>
        </label>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>
            <span>Category</span>
            <select name="new_category" form="txnForm">
              <option value="no_change" selected>-- Don't Change --</option>
              <option value="none">Uncategorized</option>
              {% for cat in categories %}
              <option value="{{ cat.id }}">{{ cat.name }}</option>
              {% endfor %}
            </select>
          </label>
        </div>

        <div class="form-field">
          <label>
            <span>Date</span>
            <input type="date" name="new_date" form="txnForm" />
          </label>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-outline" onclick="closeModal('txnEditModal')">Cancel</button>
        <button type="button" class="btn btn-fill btn-primary" onclick="closeModal('txnEditModal')"
          hx-post="{% url 'edit_transactions' %}"
          hx-include="#txnForm"
          hx-target="#main-content"
          hx-disabled-elt="this"
        >
          Apply Changes
        </button>
      </div>
    </div>
  </div>
</dialog>

<script>
  (() => {
    const container = document.getElementById("transactionsContainer");
    const editToggle = document.getElementById("editModeToggle");
    const txnForm = document.getElementById("txnForm");
    const selectedCount = document.getElementById("selectedCount");
    const selectAllCb = document.getElementById("selectAllCb");

    const updateToolbar = () => {
      const items = [...document.querySelectorAll(".item-checkbox")];
      const checkedCount = items.filter(cb => cb.checked).length;

      document.querySelectorAll(".group-checkbox").forEach(group => {
        const groupItems = items.filter(cb => cb.dataset.date === group.dataset.date);
        group.checked = groupItems.length > 0 && groupItems.every(cb => cb.checked);
      });

      selectedCount.textContent = checkedCount + " selected";
      selectAllCb.checked = items.length > 0 && checkedCount === items.length;
    };

    editToggle.addEventListener("click", () => {
      const isEdit = container.classList.toggle("edit-mode-active");

      editToggle.innerHTML = isEdit
        ? '<i class="ph-bold ph-x"></i><span>Cancel Edit</span>'
        : '<i class="ph-bold ph-pencil-simple text-14"></i><span>Edit mode</span>';

      if (!isEdit) {
        document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        updateToolbar();
      }
    });

    txnForm.addEventListener("change", (e) => {
      const target = e.target;

      if (target.matches(".group-checkbox")) {
        document.querySelectorAll(`.item-checkbox[data-date="${target.dataset.date}"]`).forEach(cb => cb.checked = target.checked);
      }

      if (target.matches('input[type="checkbox"]')) updateToolbar();
    });

    selectAllCb.addEventListener("change", (e) => {
      document.querySelectorAll(".item-checkbox, .group-checkbox").forEach(cb => cb.checked = e.target.checked);
      updateToolbar();
    });

    document.body.addEventListener("htmx:afterSettle", () => {
      if (document.getElementById("txnForm")) updateToolbar();
    });

    updateToolbar();
  })();
</script>
{% endblock %}
